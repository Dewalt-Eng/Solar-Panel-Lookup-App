<!DOCTYPE html>
<html>
<head>
    <title>Warehouse Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Warehouse QR Dashboard</h1>

    <div class="card">
        <h2>Import Solar Units</h2>
        <form action="/upload/solar" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload Solar Units</button>
        </form>
    </div>

    <div class="card">
        <h2>Import Panel Tests</h2>
        <form action="/upload/tests" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload Panel Tests</button>
        </form>
    </div>

    <div class="card">
        <h2>QR Lookup</h2>
        <form action="/items/lookup-view" method="get">
            <input type="text" name="serial" placeholder="Enter Serial Number" required>
            <button type="submit">View Item</button>
        </form>
    </div>

</div>

</body>
</html>
